<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff80ab"/>
      <stop offset="50%" stop-color="#ff4081"/>
      <stop offset="100%" stop-color="#c2185b"/>
    </radialGradient>
    <radialGradient id="heartGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ff4081"/>
      <stop offset="100%" stop-color="#ad1457"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#880e4f" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing rim -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.4"/>

  <!-- Romantic Central Candy Heart -->
  <g filter="url(#shadow)">
    <path d="M256 420 C120 310 60 230 60 150 C60 85 110 50 175 50 C215 50 240 75 256 95 C272 75 297 50 337 50 C402 50 452 85 452 150 C452 230 392 310 256 420 Z" fill="url(#heartGrad)"/>
  </g>

  <!-- Specular Shines -->
  <ellipse cx="170" cy="120" rx="40" ry="22" transform="rotate(-30 170 120)" fill="#ffffff" opacity="0.65"/>
  <circle cx="130" cy="180" r="14" fill="#ffffff" opacity="0.45"/>

  <!-- Queen Crown for Walaa -->
  <g transform="translate(196, 12) scale(1.2)">
    <path d="M10 55 L30 80 L50 25 L70 80 L90 55 L95 90 L5 90 Z" fill="#ffd700" stroke="#ffb300" stroke-width="3"/>
    <circle cx="10" cy="50" r="7" fill="#ff1744"/>
    <circle cx="50" cy="20" r="8" fill="#00e5ff"/>
    <circle cx="90" cy="50" r="7" fill="#ff1744"/>
  </g>

  <!-- Sweet Sparkles -->
  <text x="75" y="130" font-size="44" fill="#ffffff" opacity="0.85">✨</text>
  <text x="390" y="120" font-size="44" fill="#ffffff" opacity="0.85">✨</text>
  <text x="400" y="370" font-size="40" fill="#ffd54f" opacity="0.9">⭐</text>
  <text x="70" y="360" font-size="40" fill="#ffd54f" opacity="0.9">⭐</text>

  <!-- Walaa Branding Text -->
  <text x="256" y="275" font-family="'Pacifico', 'Brush Script MT', cursive, sans-serif" font-size="86" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.3))">Walaa</text>
  <text x="256" y="335" font-family="'Fredoka', sans-serif" font-size="34" font-weight="700" fill="#ffebee" text-anchor="middle" letter-spacing="4">SWEET CRUSH</text>
</svg>
